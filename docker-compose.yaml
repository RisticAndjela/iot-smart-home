services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend
    depends_on:
      - mosquitto
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    ports:
      - "5000:5000"
    volumes:
      - ./:/app  
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: IOT
      DOCKER_INFLUXDB_INIT_PASSWORD: iotpassword
      DOCKER_INFLUXDB_INIT_ORG: FTN
      DOCKER_INFLUXDB_INIT_BUCKET: iot-sensor-report
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: iot-super-token
    volumes:
      - influxdb_data:/var/lib/influxdb2

  grafana:
    image: grafana/grafana-oss
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true

  bridge:
    build:
      context: .
      dockerfile: Dockerfile_bridge # Napravi jednostavan Dockerfile za server.py
    container_name: mqtt_bridge
    depends_on:
      - mosquitto
      - influxdb
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - MQTT_HOST=mosquitto

volumes:
  influxdb_data:
  grafana_data: