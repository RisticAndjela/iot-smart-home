<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IoT — Sensors</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="container py-4">
    <div class="d-flex align-items-center mb-3">
      <h1 class="h5 page-title me-3">Sensors</h1>
      <div id="deviceTitle" class="text-muted"></div>
    </div>

    <div id="controls" class="mb-3">
      <button id="startAllBtn" class="btn btn-sm btn-outline-success me-2">Start all sims</button>
      <button id="stopAllBtn" class="btn btn-sm btn-outline-danger">Stop all sims</button>
    </div>

    <div id="sensorsRow" class="row g-3"></div>

    <div class="card mt-4">
      <div class="card-body">
        <h6>Logs</h6>
        <div id="logs" style="max-height:240px; overflow:auto;"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <script src="/static/js/sensor.js"></script>
</body>
</html>
