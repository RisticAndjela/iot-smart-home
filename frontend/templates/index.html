<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IoT Smart Home Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>

  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="container-fluid">
    <div class="row g-3">
      <div class="col-12">
        <h1 class="h4 page-title">IoT Smart Home — Dashboard</h1>
      </div>

      <div class="col-md-3 sidebar">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Devices</h5>
            <div id="devicesList" class="list-group" aria-label="Devices list"></div>
          </div>
        </div>
        <div class="card mt-3">
          <div class="card-body">
            <h6>Logs</h6>
            <div id="logs" style="max-height:300px; overflow:auto;"></div>
          </div>
        </div>
      </div>

      <div class="col-md-9">
        <div id="mainArea">
          <div class="alert alert-info">Select a device to see sensors & actuators.</div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
