<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IoT Smart Home Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>

  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="container-fluid">
    <div class="row g-3">
      <div class="col-12">
        <h1 class="h4 page-title">IoT Smart Home — Dashboard</h1>
      </div>

      <!-- Sidebar -->
      <div class="col-lg-3 sidebar">
        <!-- Connection / Status -->
        <div class="card mb-3">
          <div class="card-body">
            <div class="d-flex align-items-center justify-content-between">
              <h5 class="card-title mb-0">Status</h5>
              <span id="mqttBadge" class="badge rounded-pill bg-secondary">MQTT: —</span>
            </div>
            <div class="mt-2 small text-muted">
              <span>Socket: </span><span id="socketBadge" class="badge bg-secondary">—</span>
              <span class="ms-2">Last snapshot: </span><span id="snapAge" class="text-muted">—</span>
            </div>
          </div>
        </div>

        <!-- Devices -->
        <div class="card">
          <div class="card-body">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <h5 class="card-title mb-0">Devices</h5>
              <button class="btn btn-sm btn-outline-light" id="refreshDevicesBtn" type="button">Refresh</button>
            </div>
            <div id="devicesList" class="list-group" aria-label="Devices list"></div>
          </div>
        </div>

        <!-- Commands -->
        <div class="card mt-3">
          <div class="card-body">
            <h6 class="mb-2">Quick commands (controller)</h6>

            <div class="d-flex flex-wrap gap-2 mb-2">
              <button class="btn btn-sm btn-outline-light" data-cmd="help">help</button>
              <button class="btn btn-sm btn-outline-light" data-cmd="status">status</button>
              <button class="btn btn-sm btn-outline-success" data-cmd="arm">arm</button>
              <button class="btn btn-sm btn-outline-warning" data-cmd="disarm">disarm</button>
              <button class="btn btn-sm btn-outline-danger" data-cmd="alarm_on">alarm_on</button>
              <button class="btn btn-sm btn-outline-secondary" data-cmd="alarm_off">alarm_off</button>
              <button class="btn btn-sm btn-outline-info" data-cmd="people_reset">people_reset</button>
            </div>

            <div class="input-group input-group-sm">
              <input id="customCmd" type="text" class="form-control" placeholder="custom command (e.g. lcd Hello)" />
              <button class="btn btn-primary" id="sendCustomCmdBtn" type="button">Send</button>
            </div>

            <div class="mt-2 text-muted small">
              Commands are published to MQTT and handled by <code>app.py</code> controller queue.
            </div>
          </div>
        </div>

        <!-- Logs -->
        <div class="card mt-3">
          <div class="card-body">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <h6 class="mb-0">Logs</h6>
              <button class="btn btn-sm btn-outline-light" id="clearLogsBtn" type="button">Clear</button>
            </div>
            <div id="logs" aria-label="Logs"></div>
          </div>
        </div>
      </div>

      <!-- Main -->
      <div class="col-lg-9">
        <div id="mainArea">
          <div class="alert alert-info">Select a device to see sensors &amp; actuators.</div>
        </div>
      </div>
    </div>
  </div>

<script>
/* -----------------------------
   Helpers
------------------------------ */
function el(tag, cls='', txt='') {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined && txt !== null && txt !== '') e.innerText = txt;
  return e;
}

function safeJsonStringify(x) {
  try { return JSON.stringify(x); } catch(e) { return String(x); }
}

function log(msg, level='info') {
  const logsEl = document.getElementById('logs');
  const at = new Date().toLocaleTimeString();
  const row = document.createElement('div');
  row.innerText = `[${at}] ${msg}`;
  if (level === 'error') row.style.color = 'rgba(255,120,120,0.9)';
  if (level === 'warn') row.style.color = 'rgba(255,210,120,0.9)';
  if (logsEl) logsEl.prepend(row);
  else console.log(row.innerText);
}

function setBadge(elId, text, tone='secondary') {
  const b = document.getElementById(elId);
  if (!b) return;
  b.className = `badge ${b.classList.contains('rounded-pill') ? 'rounded-pill ' : ''}bg-${tone}`;
  b.innerText = text;
}

/* -----------------------------
   API: commands
------------------------------ */
async function sendCommand(cmd) {
  cmd = String(cmd || '').trim();
  if (!cmd) return;

  try {
    const res = await fetch('/api/commands', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ cmd, deviceId: selectedDeviceId })
    });
    const json = await res.json().catch(()=>null);

    if (!res.ok || !json || !json.ok) {
      log(`Command failed: ${res.status} ${safeJsonStringify(json)}`, 'error');
      return;
    }
    log(`Command sent (${selectedDeviceId || 'PI1'}): ${cmd}`);
  } catch (e) {
    log(`Command error: ${e.message}`, 'error');
  }
}

/* -----------------------------
   State
------------------------------ */
const sensorHist = {};   // code -> [{ts,value}]
const charts = {};       // code -> Chart instance
const socket = io();

let LAST_SNAPSHOT = null;
let lastMqttConnected = null;
let lastSnapshotAt = null;
let selectedDeviceId = null;

/* -----------------------------
   Devices list
------------------------------ */
async function fetchDevices() {
  try {
    const res = await fetch('/api/devices', { cache: 'no-store' });
    if (!res.ok) throw new Error('Failed to fetch devices');
    const devices = await res.json();
    renderDevices(devices);
  } catch (err) {
    log('Error fetching devices: ' + err.message, 'error');
    console.error(err);
  }
}

function renderDevices(devices) {
  const list = document.getElementById('devicesList');
  list.innerHTML = '';

  devices.forEach(d => {
    const a = el('a', 'list-group-item list-group-item-action device-card');
    a.href = '#';
    a.dataset.deviceId = d.id;

    const piNum = String(d.pi || '').trim();
    const piCls = piNum === '1' ? 'pi1' : (piNum === '2' ? 'pi2' : (piNum === '3' ? 'pi3' : '') );
    if (piCls) a.classList.add(piCls);

    a.innerHTML = `
      <div class="d-flex w-100 justify-content-between align-items-center">
        <h6 class="mb-1">${d.name}</h6>
        <small class="text-muted">PI: ${d.pi}</small>
      </div>
      <p class="mb-1"><small>${d.description || ''}</small></p>
    `;

    a.addEventListener('click', (ev) => {
      ev.preventDefault();
      selectDevice(d.id);
      document.querySelectorAll('#devicesList .list-group-item').forEach(x=>x.classList.remove('active'));
      a.classList.add('active');
    });

    list.appendChild(a);
  });

  // If nothing selected, auto-select first
  if (!selectedDeviceId && devices.length > 0) {
    const first = devices[0];
    const firstEl = list.querySelector('[data-device-id]');
    if (firstEl) firstEl.classList.add('active');
    selectDevice(first.id);
  }
}

async function selectDevice(deviceId) {
  selectedDeviceId = deviceId;

  const main = document.getElementById('mainArea');
  main.innerHTML = `
    <div class="d-flex align-items-center gap-2">
      <div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div>
      <div>Loading device…</div>
    </div>
  `;

  try {
    const res = await fetch(`/api/devices/${deviceId}/details`, { cache: 'no-store' });
    if (!res.ok) throw new Error('Device details fetch failed');
    const data = await res.json();
    renderDeviceDetails(data);

    // Apply latest snapshot values (if any)
    applySnapshotToUI(LAST_SNAPSHOT);
  } catch (err) {
    main.innerHTML = `<div class="alert alert-danger">Failed to load device: ${err.message}</div>`;
    console.error(err);
  }
}

/* -----------------------------
   Render details (unchanged)
------------------------------ */
function renderDeviceDetails(data) {
  const main = document.getElementById('mainArea');
  main.innerHTML = '';

  const header = el('div', 'd-flex mb-3 align-items-center flex-wrap gap-2');
  header.appendChild(el('h3','me-2', `${data.name} (PI${data.pi})`));
  header.appendChild(el('small','text-muted', data.description || ''));
  main.appendChild(header);

  // Sensors
  main.appendChild(el('h5','mt-2','Sensors'));
  const sensorsRow = el('div','row g-3');

  (data.sensors || []).forEach(s => {
    const col = el('div','col-md-4');
    const card = el('div','card device-card p-2');
    const body = el('div','card-body p-2');

    body.appendChild(el('h6','card-title mb-1', `${s.name} (${s.code})`));

    const meta = el('div','mb-1 sensor-meta');
    meta.appendChild(el('span','badge bg-secondary sensor-tag', s.type || 'sensor'));
    if (s.simulated) meta.appendChild(el('span','badge bg-warning ms-1 sensor-tag','simulated'));
    body.appendChild(meta);

    const valueEl = el('div','fs-4 fw-bold mb-1','—');
    valueEl.id = `value-${s.code}`;
    body.appendChild(valueEl);

    // For DHT: show compact T/H placeholders (we fill from snapshot)
    if (String(s.code || '').toUpperCase().startsWith('DHT')) {
      const th = el('div','small text-muted');
      th.innerHTML = `<span class="me-2">T:</span><span id="dht-t-${s.code}">—</span>
                      <span class="ms-3 me-2">H:</span><span id="dht-h-${s.code}">—</span>`;
      body.appendChild(th);
    }

    const canvas = el('canvas','sparkline');
    canvas.id = `chart-${s.code}`;
    body.appendChild(canvas);

    card.appendChild(body);
    col.appendChild(card);
    sensorsRow.appendChild(col);

    sensorHist[s.code] = sensorHist[s.code] || [];
    renderSparkline(s.code);
  });

  main.appendChild(sensorsRow);

  // Actuators
  main.appendChild(el('h5','mt-4','Actuators'));
  const actuatorsRow = el('div','row g-3 mt-1');

  (data.actuators || []).forEach(a => {
    const col = el('div','col-md-4');
    const card = el('div','card p-2');
    const body = el('div','card-body p-2');

    body.appendChild(el('h6','card-title mb-2', `${a.name} (${a.code})`));

    const stateEl = el('div','mb-2');
    stateEl.innerHTML = `State: <span class="fw-bold" id="actstate-${a.code}">—</span>`;
    body.appendChild(stateEl);

    const controls = el('div','d-flex gap-2 flex-wrap');

    if (a.code === 'DL') {
      const onBtn = el('button','btn btn-sm btn-success','ON');
      const offBtn = el('button','btn btn-sm btn-danger','OFF');
      const beepBtn = el('button','btn btn-sm btn-outline-light','BEEP(1.5s)');
      onBtn.onclick = () => sendCommand('dl_on');
      offBtn.onclick = () => sendCommand('dl_off');
      beepBtn.onclick = () => sendCommand('dl_beep');
      controls.appendChild(onBtn); controls.appendChild(offBtn); controls.appendChild(beepBtn);

    } else if (a.code === 'DB') {
      const onBtn = el('button','btn btn-sm btn-success','ON');
      const offBtn = el('button','btn btn-sm btn-danger','OFF');
      const beepBtn = el('button','btn btn-sm btn-outline-light','BEEP(1.5s)');
      onBtn.onclick = () => sendCommand('b');
      offBtn.onclick = () => sendCommand('boff');
      beepBtn.onclick = () => sendCommand('beep');
      controls.appendChild(onBtn); controls.appendChild(offBtn); controls.appendChild(beepBtn);

    } else if (a.code === 'BRGB') {
      const presets = ['red','green','blue','white','off'];
      presets.forEach(c => {
        const btn = el('button','btn btn-sm btn-outline-info', c);
        btn.onclick = () => sendCommand(`brgb_${c}`);
        controls.appendChild(btn);
      });
      const cycleBtn = el('button','btn btn-sm btn-outline-warning','cycle');
      cycleBtn.onclick = () => sendCommand('brgb_cycle');
      controls.appendChild(cycleBtn);

    } else if (a.code === 'LCD') {
      const inp = el('input','form-control form-control-sm');
      inp.placeholder = 'text';
      inp.style.maxWidth = '220px';
      const btn = el('button','btn btn-sm btn-primary','Send');
      btn.onclick = ()=> sendCommand('lcd ' + (inp.value || ''));
      controls.appendChild(inp); controls.appendChild(btn);

    } else {
      const statusBtn = el('button','btn btn-sm btn-outline-light','status');
      statusBtn.onclick = () => sendCommand('status');
      controls.appendChild(statusBtn);
    }

    body.appendChild(controls);
    card.appendChild(body);
    col.appendChild(card);
    actuatorsRow.appendChild(col);
  });

  main.appendChild(actuatorsRow);
}

/* -----------------------------
   Charts
------------------------------ */
function getYBoundsFromData(values) {
  if (!values || values.length === 0) return { min: 0, max: 100 };
  const nums = values.map(v => Number(v)).filter(v => Number.isFinite(v));
  if (nums.length === 0) return { min: 0, max: 100 };
  let min = Math.min(...nums), max = Math.max(...nums);
  if (max <= 1 && min >= 0) return { min: 0, max: 1 };
  const span = Math.max(max - min, 1);
  const pad = span * 0.2;
  min = min - pad; max = max + pad;
  return { min: Math.floor(min), max: Math.ceil(max) };
}

function renderSparkline(code) {
  const canvas = document.getElementById(`chart-${code}`);
  if (!canvas) return;

  const dataVals = (sensorHist[code] || []).slice(-25).map(p => p.value);
  const bounds = getYBoundsFromData(dataVals);

  if (charts[code]) {
    try { charts[code].destroy(); } catch(e) {}
  }

  charts[code] = new Chart(canvas, {
    type: 'line',
    data: {
      labels: dataVals.map((_,i)=>i),
      datasets: [{
        data: dataVals,
        borderColor: '#00d2ff',
        borderWidth: 1,
        pointRadius: 0,
        tension: 0.35
      }]
    },
    options: {
      animation: false,
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { display:false },
        y: {
          display:true,
          min: bounds.min,
          max: bounds.max,
          ticks: { maxTicksLimit:3, color:'rgba(255,255,255,0.6)' },
          grid: { color: 'rgba(255,255,255,0.06)' }
        }
      },
      plugins: { legend:{ display:false }, tooltip:{ enabled:false } }
    }
  });
}

function pushNumeric(code, value) {
  const num = Number(value);
  if (!Number.isFinite(num)) return;

  sensorHist[code] = sensorHist[code] || [];
  sensorHist[code].push({ ts: Date.now(), value: num });
  if (sensorHist[code].length > 200) sensorHist[code].shift();

  const chart = charts[code];
  if (!chart) return;

  const lastN = sensorHist[code].slice(-25).map(p => p.value);
  chart.data.labels = lastN.map((_,i)=>i);
  chart.data.datasets[0].data = lastN;
  const bounds = getYBoundsFromData(lastN);
  chart.options.scales.y.min = bounds.min;
  chart.options.scales.y.max = bounds.max;
  chart.update('none');
}

function updateSensorValueUI(code, value, simulated=false) {
  const vEl = document.getElementById(`value-${code}`);
  if (!vEl) return;

  let display = value;
  if (value && typeof value === 'object') {
    const parts = [];
    if (value.temperature !== undefined) parts.push(`${value.temperature}°C`);
    if (value.humidity !== undefined) parts.push(`${value.humidity}%`);
    display = parts.join(' / ') || safeJsonStringify(value);
  } else if (Number.isFinite(Number(value))) {
    display = String(Number(value));
  } else {
    display = String(value);
  }

  vEl.innerText = display + (simulated ? ' (sim)' : '');
  pushNumeric(code, value);
}

/* -----------------------------
   Snapshot -> UI
------------------------------ */
function applySnapshotToUI(snap) {
  if (!snap || !Array.isArray(snap.items)) return;

  snap.items.forEach(it => {
    const device = String(it.device || '').toUpperCase();
    const kind = String(it.kind || '').toLowerCase();
    const typ = String(it.type || '').toLowerCase();

    if (kind === 'actuator') {
      const st = document.getElementById(`actstate-${device}`);
      if (st) {
        if ((device === 'DL' || device === 'DB') && (it.value === 0 || it.value === 1 || it.value === false || it.value === true)) {
          const on = (it.value === 1 || it.value === true);
          st.innerText = on ? 'ON' : 'OFF';
        } else {
          st.innerText = String(it.value);
        }
      }
    }

    if (kind === 'sensor') {
      if (device.startsWith('DHT') && (typ === 'temperature' || typ === 'humidity')) {
        const tEl = document.getElementById(`dht-t-${device}`);
        const hEl = document.getElementById(`dht-h-${device}`);

        if (typ === 'temperature' && tEl) tEl.innerText = `${it.value}°C`;
        if (typ === 'humidity' && hEl) hEl.innerText = `${it.value}%`;

        const big = document.getElementById(`value-${device}`);
        if (big) {
          const t = tEl ? tEl.innerText : '';
          const h = hEl ? hEl.innerText : '';
          const parts = [];
          if (t && t !== '—') parts.push(t);
          if (h && h !== '—') parts.push(h);
          big.innerText = parts.join(' / ') || '—';
        }

        if (typ === 'temperature') pushNumeric(device, it.value);
      } else {
        updateSensorValueUI(device, it.value, it.simulated);
      }
    }
  });
}

/* -----------------------------
   Socket.IO wiring
------------------------------ */
socket.on('connect', ()=> {
  setBadge('socketBadge', 'connected', 'success');
  log('Socket connected');
});

socket.on('disconnect', ()=> {
  setBadge('socketBadge', 'disconnected', 'secondary');
  log('Socket disconnected', 'warn');
});

socket.on('snapshot', snap => {
  LAST_SNAPSHOT = snap;
  lastSnapshotAt = Date.now();

  const connected = !!(snap && snap.mqtt_connected);
  if (lastMqttConnected === null) {
    log(`MQTT: ${connected ? 'connected' : 'disconnected'}`, connected ? 'info' : 'warn');
  } else if (connected !== lastMqttConnected) {
    log(`MQTT: ${connected ? 'connected' : 'disconnected'}`, connected ? 'info' : 'warn');
  }
  lastMqttConnected = connected;

  const badge = document.getElementById('mqttBadge');
  if (badge) {
    badge.className = 'badge rounded-pill ' + (connected ? 'bg-success' : 'bg-secondary');
    badge.innerText = `MQTT: ${connected ? 'connected' : 'disconnected'}`;
  }

  applySnapshotToUI(snap);
});

socket.on('event', payload => {
  // Debug: prikazi eventove u UI logs (po potrebi ugasi)
  log(`Event ${payload.topic}: ${safeJsonStringify(payload.event)}`);
});

/* -----------------------------
   UI ticks
------------------------------ */
setInterval(() => {
  const snapAgeEl = document.getElementById('snapAge');
  if (!snapAgeEl) return;
  if (!lastSnapshotAt) { snapAgeEl.innerText = '—'; return; }
  const sec = Math.floor((Date.now() - lastSnapshotAt) / 1000);
  snapAgeEl.innerText = `${sec}s ago`;
}, 1000);

/* -----------------------------
   Buttons binding
------------------------------ */
document.getElementById('refreshDevicesBtn')?.addEventListener('click', fetchDevices);

document.getElementById('clearLogsBtn')?.addEventListener('click', () => {
  const logsEl = document.getElementById('logs');
  if (logsEl) logsEl.innerHTML = '';
});

document.querySelectorAll('[data-cmd]').forEach(btn => {
  btn.addEventListener('click', () => sendCommand(btn.getAttribute('data-cmd')));
});

document.getElementById('sendCustomCmdBtn')?.addEventListener('click', () => {
  const inp = document.getElementById('customCmd');
  sendCommand(inp?.value || '');
  if (inp) inp.value = '';
});

document.getElementById('customCmd')?.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    sendCommand(e.target.value || '');
    e.target.value = '';
  }
});

/* -----------------------------
   Init
------------------------------ */
fetchDevices();
setBadge('socketBadge', 'connecting…', 'secondary');
</script>
</body>
</html>
