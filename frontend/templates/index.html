<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IoT Smart Home Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>

  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="container-fluid">
    <div class="row g-3">
      <div class="col-12">
        <h1 class="h4 page-title">IoT Smart Home — Dashboard</h1>
      </div>

      <div class="col-md-3 sidebar">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Devices</h5>
            <div id="devicesList" class="list-group" aria-label="Devices list"></div>
          </div>
        </div>

        <div class="card mt-3">
            <div class="card-body p-2">
                <h5 class="card-title px-2">Views</h5>
                <div class="list-group">
                <a href="#" class="list-group-item list-group-item-action" onclick="showWebcam(event, this)">
                    <div class="d-flex align-items-center">
                    <span class="me-2">📷</span> Webcam View
                    </div>
                </a>
                <a href="#" class="list-group-item list-group-item-action" onclick="showGrafana(event, this)">
                    <div class="d-flex align-items-center">
                    <span class="me-2">📊</span> Grafana Dashboard
                    </div>
                </a>
                </div>
            </div>
            </div>

        <div class="card mt-3">
          <div class="card-body">
            <h6>Logs</h6>
            <div id="logs"></div>
          </div>
        </div>
      </div>

      <div class="col-md-9">
        <div id="mainArea">
          <div class="alert alert-info">Select a device to see sensors & actuators.</div>
        </div>
      </div>
    </div>
  </div>

<script>

// 1. Na vrhu kod ostalih state promenljivih dodaj ovo:
const sensorHist = {};
const charts = {};
const socket = io();
let activeDeviceId = null;

window.addEventListener('unhandledrejection', function(event) {
  console.warn('Unhandled promise rejection captured:', event.reason);
});
window.addEventListener('error', function(ev) {
  console.warn('Global error captured:', ev.error || ev.message, ev);
});



// 2. Izmeni selectDevice funkciju da zapamti ID
async function selectDevice(deviceId) {
  activeDeviceId = deviceId; // Zapamti koji je uređaj otvoren
  const main = document.getElementById('mainArea');
  
  // Spinner prikazujemo samo prvi put, ne i pri automatskom osvežavanju
  if (main.innerHTML.includes('alert-info') || main.innerHTML === '') {
    main.innerHTML = '<div class="spinner-border text-info" role="status"></div> Loading...';
  }

  try {
    const res = await fetch(`/api/devices/${deviceId}/details`);
    if (!res.ok) throw new Error('Device details fetch failed');
    const data = await res.json();
    
    // Ako korisnik nije u međuvremenu prešao na drugi uređaj ili tab (Webcam/Grafana)
    if (activeDeviceId === deviceId) {
       renderDeviceDetails(data);
    }
  } catch (err) {
    console.error(err);
  }
}

// 3. Dodaj funkciju koja će se pokretati svakih 10 sekundi
async function periodicRefresh() {
  if (activeDeviceId) {
    console.log("Auto-refreshing device:", activeDeviceId);
    // Pozivamo istu funkciju, ali renderDeviceDetails će se pobrinuti za grafikone
    await selectDevice(activeDeviceId);
  }
  // Takođe možemo osvežiti i listu uređaja sa leve strane ako se nešto promenilo
  fetchDevices();
}

// 4. Na samom kraju skripte (ispod fetchDevices() poziva) pokreni tajmer
fetchDevices();
setInterval(periodicRefresh, 10000); // 10000ms = 10 sekundi

function el(tag, cls='', txt='') {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt !== undefined && txt !== null && txt !== '') e.innerText = txt;
    return e;
}

function log(msg) {
  const logsEl = document.getElementById('logs');
  const at = new Date().toLocaleTimeString();
  const row = document.createElement('div');
  row.innerText = `[${at}] ${msg}`;
  logsEl.prepend(row);
}

// fetch devices
async function fetchDevices() {
  try {
    const res = await fetch('/api/devices');
    if (!res.ok) throw new Error('Failed to fetch devices');
    const devices = await res.json();
    renderDevices(devices);
  } catch (err) {
    log('Error fetching devices: ' + err.message);
    console.error(err);
  }
}

function renderDevices(devices) {
  const list = document.getElementById('devicesList');
  list.innerHTML = '';
  devices.forEach(d => {
    const a = el('a', 'list-group-item list-group-item-action device-card');
    a.href = '#';
    a.dataset.deviceId = d.id;
    a.innerHTML = `<div class="d-flex w-100 justify-content-between">
      <h6 class="mb-1">${d.name}</h6>
      <small class="text-muted">PI: ${d.pi}</small>
    </div>
    <p class="mb-1"><small>${d.description || ''}</small></p>`;
    a.addEventListener('click', (ev) => {
      ev.preventDefault();
      selectDevice(d.id);
      document.querySelectorAll('.list-group-item').forEach(x=>x.classList.remove('active'));
      a.classList.add('active');
    });
    list.appendChild(a);
  });
}

function renderDeviceDetails(data) {
  const main = document.getElementById('mainArea');
  main.innerHTML = '';

  // 1. Header
  const header = el('div', 'd-flex mb-3 align-items-center');
  header.appendChild(el('h3', 'me-3', `${data.name} (PI${data.pi})`));
  header.appendChild(el('small', 'text-muted', data.description || ''));
  main.appendChild(header);

  // --- SEKCIJA: SENZORI ---
  main.appendChild(el('h5', 'mt-3', 'Sensors'));
  const sensorsRow = el('div', 'row g-3');

  data.sensors.forEach(s => {
    if (s.history && Array.isArray(s.history) && s.history.length > 0) {
      sensorHist[s.id] = s.history.map(val => ({ ts: Date.now(), value: Number(val) }));
    } else if (!sensorHist[s.id]) {
      sensorHist[s.id] = [];
    }

    const col = el('div', 'col-md-4');
    const card = el('div', 'card device-card p-2 shadow-sm');
    const body = el('div', 'card-body p-2');
    
    body.appendChild(el('h6', 'card-title mb-1', `${s.name} (${s.code})`));
    
    const lastVal = (s.history && s.history.length > 0) ? s.history[s.history.length - 1] : '—';
    const valueEl = el('div', 'fs-4 fw-bold mb-1', lastVal);
    valueEl.id = `value-${s.id}`;
    body.appendChild(valueEl);

    const canvas = el('canvas', 'sparkline');
    canvas.id = `chart-${s.id}`;
    body.appendChild(canvas);

    // Kontrole senzora
    const ctrl = el('div', 'mt-2 d-flex gap-1 flex-wrap');
    if (['binary', 'door', 'button', 'motion'].includes((s.type || '').toLowerCase())) {
      const btn = el('button', 'btn btn-sm btn-primary', 'Trigger');
      btn.onclick = () => sendSensorCommand(s.id, { command: 'trigger' });
      ctrl.appendChild(btn);
    } else if (['distance', 'ultrasonic'].includes((s.type || '').toLowerCase())) {
      const input = el('input', 'form-control form-control-sm d-inline-block');
      input.type = 'number'; input.placeholder = 'cm'; input.style.width = '70px';
      const btn = el('button', 'btn btn-sm btn-primary', 'Set');
      btn.onclick = () => {
        const v = parseFloat(input.value);
        if (!isNaN(v)) sendSensorCommand(s.id, { command: 'set', value: v });
      };
      ctrl.appendChild(input); ctrl.appendChild(btn);
    }
    
    body.appendChild(ctrl);
    card.appendChild(body);
    col.appendChild(card);
    sensorsRow.appendChild(col);
    setTimeout(() => renderSparkline(s.id), 60);
  });
  main.appendChild(sensorsRow);

  // --- SEKCIJA: AKTUATORI ---
  main.appendChild(el('h5', 'mt-4', 'Actuators'));
  const actuatorsRow = el('div', 'row g-3 mt-1');

  data.actuators.forEach(a => {
    const col = el('div', 'col-md-4');
    const card = el('div', 'card p-2 shadow-sm');
    const body = el('div', 'card-body p-2');
    
    body.appendChild(el('h6', 'card-title mb-2', `${a.name} (${a.code})`));
    
    const stateEl = el('div', 'mb-2', `Display: `);
    const stateColor = (parseInt(a.state) > 0) ? 'text-success' : 'text-danger';
    const stateSpan = el('span', `fw-bold ${stateColor}`, (a.state || '0000'));
    stateSpan.id = `actstate-${a.id}`;
    stateEl.appendChild(stateSpan);
    body.appendChild(stateEl);

    const controls = el('div', 'd-flex gap-2');
    
    // LOGIKA ZA 4SD TAJMER
    if (a.kind === 'text' || a.code.includes('4SD')) {
      const inp = el('input', 'form-control form-control-sm');
      inp.type = 'number';
      inp.placeholder = 'Start value';
      
      const btn = el('button', 'btn btn-sm btn-primary', 'Start Timer');
      btn.onclick = () => {
        if (!inp.value) return;
        sendActuatorCommand(a.id, { value: inp.value, type: '4sd' });
      };
      controls.appendChild(inp); 
      controls.appendChild(btn);
    } 
    // Ostali aktuatori
    else if (a.kind === 'binary') {
      const onBtn = el('button', 'btn btn-sm btn-success', 'ON');
      const offBtn = el('button', 'btn btn-sm btn-danger', 'OFF');
      onBtn.onclick = () => sendActuatorCommand(a.id, { value: 'on' });
      offBtn.onclick = () => sendActuatorCommand(a.id, { value: 'off' });
      controls.appendChild(onBtn); controls.appendChild(offBtn);
    }

    body.appendChild(controls);
    card.appendChild(body);
    col.appendChild(card);
    actuatorsRow.appendChild(col);
  });
  main.appendChild(actuatorsRow);
}

/* Chart helpers */
function getYBoundsFromData(values) {
  if (!values || values.length === 0) return { min: 0, max: 100 };
  const nums = values.map(v => Number(v)).filter(v => Number.isFinite(v));
  if (nums.length === 0) return { min: 0, max: 100 };
  let min = Math.min(...nums), max = Math.max(...nums);
  if (max <= 1 && min >= 0) return { min: 0, max: 1 };
  let span = Math.max(max - min, 1);
  const pad = span * 0.2;
  min = min - pad; max = max + pad;
  span = Math.max(max - min, 2);
  if ((max - min) < span) {
    const extra = (span - (max - min)) / 2;
    min -= extra; max += extra;
  }
  if (min < 0) min = 0;
  return { min: Math.floor(min), max: Math.ceil(max) };
}

function renderSparkline(sensorId) {
  const canvas = document.getElementById(`chart-${sensorId}`);
  if (!canvas) return;

  const dataVals = (sensorHist[sensorId] || []).slice(-25).map(p => p.value);
  const bounds = getYBoundsFromData(dataVals);

  if (charts[sensorId]) {
    try { charts[sensorId].destroy(); } catch(e) {}
  }

  charts[sensorId] = new Chart(canvas, {
    type: 'line',
    data: {
      labels: dataVals.map((_, i) => i),
      datasets: [{
        data: dataVals,
        // Koristimo direktnu boju da izbegnemo probleme sa CSS varijablama
        borderColor: '#00d2ff', 
        backgroundColor: 'rgba(0, 210, 255, 0.1)', // Blaga senka ispod linije
        borderWidth: 3, // Podebljana linija
        fill: true,
        pointRadius: 0,
        tension: 0.4
      }]
    },
    options: {
      animation: false,
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { display: false },
        y: { 
          display: true, 
          min: bounds.min, 
          max: bounds.max,
          grid: { color: 'rgba(255, 255, 255, 0.05)' }, // Suptilne mrežne linije
          ticks: { 
            maxTicksLimit: 3, 
            color: 'rgba(255, 255, 255, 0.5)',
            font: { size: 10 }
          } 
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false }
      }
    }
  });
}

function showWebcam(event, element) {
  event.preventDefault();
  document.querySelectorAll('.list-group-item').forEach(x => x.classList.remove('active'));
  element.classList.add('active');

  const main = document.getElementById('mainArea');
  main.innerHTML = `
    <div class="card bg-dark text-white">
      <div class="card-body">
        <h3>Live Webcam Stream</h3>
        <hr>
        <div class="text-center bg-black rounded p-3" style="min-height: 400px; display: flex; align-items: center; justify-content: center;">
          <img src="/static/img/webcam_placeholder.jpg" class="img-fluid rounded" alt="Webcam Stream" 
               onerror="this.src='https://via.placeholder.com/640x480?text=No+Camera+Signal'">
        </div>
        <p class="mt-3 text-muted">Striming uživo sa Raspberry Pi kamere.</p>
      </div>
    </div>
  `;
}

function showGrafana(event, element) {
    event.preventDefault();
    document.querySelectorAll('.list-group-item').forEach(x => x.classList.remove('active'));
    element.classList.add('active');

    const main = document.getElementById('mainArea');
    
    // Savet: Dodaj &kiosk na kraj URL-a da sakriješ Grafana meni
    const grafanaUrl = "http://localhost:3000/dashboard/snapshot/IAkV8sRPOd3XpSzei7U9U68DbRUl1Ued"; 

    main.innerHTML = `
        <div class="card shadow-sm" style="height: 85vh;">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Analytics & History</h5>
                <button class="btn btn-sm btn-outline-secondary" onclick="location.reload()">Refresh All</button>
            </div>
            <div class="card-body p-0">
                <iframe src="${grafanaUrl}" 
                        width="100%" height="100%" 
                        frameborder="0" 
                        style="border-radius: 0 0 8px 8px;">
                </iframe>
            </div>
        </div>
    `;
}

function updateSensorValue(sensorId, value, simulated = false) {
  const vEl = document.getElementById(`value-${sensorId}`);
  let display = value;
  let numericValue = 0;

  // Obrada kompleksnih objekata (DHT)
  if (value && typeof value === 'object') {
    const parts = [];
    if (value.temperature !== undefined) parts.push(`${value.temperature}°C`);
    if (value.humidity !== undefined) parts.push(`${value.humidity}%`);
    display = parts.join(' / ');
    numericValue = value.temperature !== undefined ? Number(value.temperature) : Number(value.humidity);
  } 
  // Obrada logičkih vrednosti (On/Off -> 1/0)
  else if (typeof value === 'string') {
    const vLower = value.toLowerCase();
    if (vLower === 'on' || vLower === 'true' || vLower === 'open') numericValue = 1;
    else if (vLower === 'off' || vLower === 'false' || vLower === 'closed') numericValue = 0;
    else numericValue = Number(value);
  } 
  else {
    numericValue = Number(value);
  }

  if (vEl) vEl.innerText = display + (simulated ? ' Ⓢ' : '');

  sensorHist[sensorId] = sensorHist[sensorId] || [];
  sensorHist[sensorId].push({ 
    ts: Date.now(), 
    value: isNaN(numericValue) ? 0 : numericValue, 
    simulated 
  });

  if (sensorHist[sensorId].length > 100) sensorHist[sensorId].shift();

  // Osveži grafik
  const chart = charts[sensorId];
  if (chart) {
    const lastN = sensorHist[sensorId].slice(-25).map(p => p.value);
    chart.data.labels = lastN.map((_, i) => i);
    chart.data.datasets[0].data = lastN;
    const bounds = getYBoundsFromData(lastN);
    chart.options.scales.y.min = bounds.min;
    chart.options.scales.y.max = bounds.max;
    chart.update('none');
  } else {
    renderSparkline(sensorId);
  }
}

// send actuator command
async function sendActuatorCommand(actuatorId, body) {
  try {
    const res = await fetch(`/api/actuators/${actuatorId}/command`, {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    if (!res.ok) { log(`Actuator ${actuatorId} command failed`); return; }
    const json = await res.json();
    log(`Actuator ${actuatorId} command: ${JSON.stringify(body)} => ${JSON.stringify(json)}`);
    if (json.state) {
      const stEl = document.getElementById(`actstate-${actuatorId}`);
      if (stEl) stEl.innerText = json.state;
    }
  } catch (err) {
    log('Error sending actuator command: ' + err.message);
    console.error(err);
  }
}

async function sendSensorCommand(sensorId, body) {
  try {
    const res = await fetch(`/api/sensors/${sensorId}/command`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const txt = await res.text().catch(()=>null);
      log(`Sensor ${sensorId} command failed: ${res.status} ${txt || ''}`);
      return;
    }
    const json = await res.json();
    log(`Sensor ${sensorId} command: ${JSON.stringify(body)} -> ${JSON.stringify(json.payload)}`);
  } catch (err) {
    console.error(err);
    log(`Error sending sensor command: ${err.message}`);
  }
}

/* Socket.IO events */
socket.on('connect', ()=> { log('Socket connected'); });
socket.on('sensor_update', payload => {
  if (!payload || !payload.sensor_id) return;
  updateSensorValue(payload.sensor_id, payload.value, payload.simulated);
  log(`Sensor ${payload.sensor_id} = ${JSON.stringify(payload.value)}${payload.simulated ? ' (sim)' : ''}`);
});
socket.on('actuator_update', payload => {
  if (!payload || !payload.actuator_id) return;
  const stEl = document.getElementById(`actstate-${payload.actuator_id}`);
  if (stEl) stEl.innerText = payload.state;
  log(`Actuator ${payload.actuator_id} -> ${payload.state}`);
});

// init
fetchDevices();
</script>
</body>
</html>
