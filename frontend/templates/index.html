<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IoT — PIs</title>

  <!-- Bootstrap CSS (optional, keeps some grid/util styles) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Your theme CSS -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="container py-4">
    <h1 class="h5 mb-3 page-title">Available PIs</h1>

    <!-- Custom tabs container (JS will inject .tab-btn buttons here) -->
    <div id="piTabs" class="tabs" role="tablist"></div>

    <!-- Tab content panes -->
    <div id="piTabContent" class="tab-content mt-3"></div>

    <div id="info" class="mt-3 text-muted small"></div>
  </div>

  <!-- Socket.IO (for live sensor updates) -->
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>

  <!-- Optional: Bootstrap bundle (not required for our manual tab JS) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom tabs + sensors script -->
  <script src="/static/js/tabs.js"></script>
</body>
</html>
